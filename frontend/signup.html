<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign Up</title>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background: white;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
    }
    h2 {
      text-align: center;
      margin-bottom: 1.5rem;
      color: #333;
    }
    .error-message {
      color: #d9534f;
      background-color: #f8d7da;
      padding: 0.75rem;
      margin-bottom: 1rem;
      border-radius: 4px;
      display: none;
    }
    input {
      width: 100%;
      padding: 0.75rem;
      margin-bottom: 1rem;
      border: 1px solid #ddd;
      border-radius: 4px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 0.75rem;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1rem;
    }
    button:hover {
      background-color: #0069d9;
    }
    p {
      text-align: center;
      margin-top: 1.5rem;
      color: #666;
    }
    a {
      color: #007bff;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
      <h2>Sign Up</h2>
      <div class="error-message" id="errorMessage"></div>
      <form id="signupForm">
          <input type="text" name="username" placeholder="Username" required>
          <input type="email" name="email" placeholder="Email" required>
          <input type="password" name="password" placeholder="Password" required>
          <input type="password" name="confirm_password" placeholder="Confirm Password" required>
          <button type="submit">Sign Up</button>
      </form>
      <p>Already have an account? <a href="login.html">Login here</a></p>
  </div>

  <script>
    document.getElementById('signupForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const username = document.querySelector('input[name="username"]').value;
      const email = document.querySelector('input[name="email"]').value;
      const password = document.querySelector('input[name="password"]').value;
      const confirmPass = document.querySelector('input[name="confirm_password"]').value;
      const errorElement = document.getElementById('errorMessage');

      // Client-side validation
      if (!username || !email || !password || !confirmPass) {
        errorElement.textContent = 'Please fill in all fields.';
        errorElement.style.display = 'block';
        return;
      }

      if (!/^\w+([\.-]?\w+)@\w+([\.-]?\w+)(\.\w{2,3})+$/.test(email)) {
        errorElement.textContent = 'Invalid email format.';
        errorElement.style.display = 'block';
        return;
      }

      if (password.length < 6) {
        errorElement.textContent = 'Password must be at least 6 characters long.';
        errorElement.style.display = 'block';
        return;
      }

      if (password !== confirmPass) {
        errorElement.textContent = 'Passwords do not match.';
        errorElement.style.display = 'block';
        return;
      }

      axios.post('http://localhost:5000/api/users/register', {
        username: username, // Corrected: Explicitly set the key-value pairs
        email: email,       // Corrected: Explicitly set the key-value pairs
        password: password  // Corrected: Explicitly set the key-value pairs
      })
      .then(response => {
        if (response.data.success) {
          window.location.href = 'dashboard.html'; // Or any secured page
        } else {
          errorElement.textContent = response.data.message || 'Sign up failed.'; // Corrected message
          errorElement.style.display = 'block';
        }
      })
      .catch(error => {
        errorElement.textContent = 'An error occurred. Please try again.';
        errorElement.style.display = 'block';
        console.error(error);
      });
    });
  </script>
</body>
</html>
